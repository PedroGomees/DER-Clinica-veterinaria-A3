<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Início — Clínica Veterinária</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="js/api.js?v=1"></script>
  <script src="js/auth.js?v=1"></script>
  <script src="js/nav.js?v=1"></script>
  <script>
    const conteudo = renderNav("inicio");
    const veterinario = getVeterinarioLogado();

    conteudo.innerHTML = `
      <div class="cabecalho-pagina">
        <div>
          <h1>Olá, ${escaparHtml(veterinario ? veterinario.nome_completo : "")}</h1>
          <p>Resumo rápido do sistema da clínica.</p>
        </div>
      </div>

      <div class="grade-cartoes" id="cartoes"></div>

      <div class="cartao">
        <h2>Fluxo do sistema</h2>
        <p class="texto-suave" style="line-height:1.6">
          <strong>Tutores</strong> cadastram seus endereços e dados pessoais →
          cada tutor tem um ou mais <strong>Animais</strong> →
          na ficha do animal você registra <strong>Consultas</strong>, <strong>Vacinas</strong>
          e o <strong>Microchip</strong> → vacinas antirrábicas e o cadastro do animal
          são enviados automaticamente para a API governamental simulada, acompanhada em
          <strong>Integração governo</strong>.
        </p>
      </div>
    `;

    const cartoes = document.getElementById("cartoes");

    function cartaoEstatistica(href, numero, rotulo) {
      const a = document.createElement("a");
      a.href = href;
      a.className = "cartao-estatistica";
      a.innerHTML = `<div class="numero">${numero}</div><div class="rotulo">${rotulo}</div>`;
      return a;
    }

    async function carregarResumo() {
      const [tutores, animais, integracoesPendentes] = await Promise.allSettled([
        api.get("/tutores/"),
        api.get("/animais/"),
        api.get("/integracoes/?status=FALHA"),
      ]);

      cartoes.appendChild(cartaoEstatistica(
        "tutores.html",
        tutores.status === "fulfilled" ? tutores.value.length : "—",
        "Tutores cadastrados"
      ));
      cartoes.appendChild(cartaoEstatistica(
        "animais.html",
        animais.status === "fulfilled" ? animais.value.length : "—",
        "Animais cadastrados"
      ));
      cartoes.appendChild(cartaoEstatistica(
        "integracoes.html",
        integracoesPendentes.status === "fulfilled" ? integracoesPendentes.value.length : "—",
        "Integrações com falha"
      ));
    }

    carregarResumo();
  </script>
</body>
</html>
